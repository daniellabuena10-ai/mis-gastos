<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis gastos</title>
<meta name="description" content="Controla tus gastos, ingresos, presupuesto y metas de ahorro.">
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis gastos">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Banca personal sobria: superficie clara y fría, tarjeta resumen oscura, un solo acento verde azulado; cifras en Sora tabular. */
:root{
  --bg:#f2f4f7;--surface:#ffffff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--soft:#f7f8fa;
  --accent:#0d7a64;--accent-ink:#ffffff;--accent-soft:#e6f3ef;
  --pos:#0d7a64;--neg:#b42318;--neg-soft:#fdeceb;--warn:#b54708;--warn-soft:#fef4e6;
  --hero:#0f1b2d;--hero-2:#173049;--hero-ink:#f5f7fa;--hero-muted:#9fb0c4;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;--body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e15;--surface:#121923;--ink:#e8ecf2;--muted:#8a96a8;--line:#222c3a;--soft:#18212d;
  --accent:#3fc3a1;--accent-ink:#06261e;--accent-soft:#12302a;
  --pos:#3fc3a1;--neg:#f97066;--neg-soft:#3a1714;--warn:#fdb022;--warn-soft:#3a2a0c;
  --hero:#16233a;--hero-2:#1d3350;--hero-ink:#f5f7fa;--hero-muted:#93a4ba;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e15;--surface:#121923;--ink:#e8ecf2;--muted:#8a96a8;--line:#222c3a;--soft:#18212d;
  --accent:#3fc3a1;--accent-ink:#06261e;--accent-soft:#12302a;
  --pos:#3fc3a1;--neg:#f97066;--neg-soft:#3a1714;--warn:#fdb022;--warn-soft:#3a2a0c;
  --hero:#16233a;--hero-2:#1d3350;--hero-ink:#f5f7fa;--hero-muted:#93a4ba;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 112px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.num,.amt,.big,.v{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px;gap:8px}
h1{font-family:var(--display);font-size:22px;font-weight:600;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2,h3{text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0}
.monthnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
.monthnav button{background:none;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.monthnav button:hover{background:var(--soft);color:var(--ink)}
.monthnav span{font-weight:600;min-width:112px;text-align:center;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.link .i{width:16px;height:16px}

/* Tarjeta resumen */
.hero{background:linear-gradient(155deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--hero-ink);border-radius:20px;padding:18px 18px 16px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(63,195,161,.18),transparent)}
.hero .lbl{color:var(--hero-muted)}
.hero .link{color:#7fe0c4}
.big{font-family:var(--display);font-size:36px;font-weight:600;letter-spacing:-.03em;margin:4px 0 2px;line-height:1.1}
.big small,.amt small{font-size:.6em;font-weight:500;opacity:.75}
.hero .insight{font-size:13px;color:var(--hero-muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.hero .insight b{color:var(--hero-ink);font-weight:600}
.hero .insight .i{width:16px;height:16px}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.flow{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.flow .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.flow .dot .i{width:16px;height:16px}
.flow .v{font-family:var(--display);font-weight:600;font-size:16px;margin-top:1px}
.hbar{height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:16px 0 8px}
.hbar>div{height:100%;background:#7fe0c4;border-radius:99px;transition:width .4s}
.hbar.over>div{background:#f97066}
.hrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--hero-muted)}
.hrow b{color:var(--hero-ink);font-weight:600}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:13.5px;padding:8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio>div{background:var(--soft);border-radius:12px;padding:10px 12px}
.trio .v{font-family:var(--display);font-weight:600;font-size:15px;margin-top:3px}
.cats{display:flex;flex-direction:column;gap:14px}
.cat{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center}
.ico{--c:#667085;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.mini{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.mini>div{height:100%;border-radius:99px}
.day{font-size:12px;color:var(--muted);font-weight:700;margin:16px 4px 6px;text-transform:capitalize;display:flex;justify-content:space-between;letter-spacing:.01em}
.day .num{font-weight:600}
.item{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover .t{color:var(--accent)}
.item .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .small{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.amt{font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;text-align:right}
.amt.inc{color:var(--pos)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.tag .i{width:11px;height:11px}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ico{width:46px;height:46px;border-radius:14px;--c:var(--accent)}
.empty b{color:var(--ink)}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(env(safe-area-inset-bottom) + 84px);height:52px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(13,122,100,.32);cursor:pointer;z-index:5}
.fab .i{width:22px;height:22px;stroke-width:2.2}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:6}
nav.tabbar div{display:flex;max-width:560px;width:100%}
nav.tabbar button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
nav.tabbar button .i{width:23px;height:23px}
nav.tabbar button.on{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,21,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto;animation:up .22s ease}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.hbar>div,.bar>div{transition:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet h2{font-family:var(--display);font-size:18px;font-weight:600;margin:0}
.xbtn{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.xbtn .i{width:18px;height:18px}
.amount-in{width:100%;font-family:var(--display);font-size:34px;font-weight:600;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink);padding:6px 0;outline:none;font-variant-numeric:tabular-nums}
.amount-in:focus{border-color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);background:none;border-radius:12px;padding:9px 4px 7px;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
.chip .i{color:var(--c)}
.chip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.field{display:block;margin-bottom:12px;font-weight:600}
.field input,.field select,.input{width:100%;font-size:15px;font-weight:500;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);margin-top:5px}
.field input:focus,.field select:focus,.input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.btn.sm{flex:none;padding:8px 12px;font-size:13px;border-radius:10px}
.btn.sm .i{width:16px;height:16px}
.note{font-size:12.5px;color:var(--neg);text-align:center;margin-top:8px;min-height:1em}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.hint .i{width:16px;height:16px;margin-top:1px}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;padding:10px 12px;border-radius:12px;margin-bottom:12px;display:none}
svg text{font-family:var(--body)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stats .card{margin:0}
.stat .v{font-family:var(--display);font-size:18px;font-weight:600;margin-top:4px}
textarea.csv{width:100%;height:150px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft);color:var(--ink)}
.menu-item{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.menu-item:last-child{border-bottom:0}
.menu-item .ico{--c:var(--accent)}
.chev{color:var(--muted);display:grid}
.pick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0 14px}
.pick button{aspect-ratio:1;border:1.5px solid var(--line);background:none;border-radius:10px;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--ink)}
.pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pick button.sw.on{border-color:var(--ink);border-width:3px}
.goal-ring{flex-shrink:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:16px;align-items:center;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer}
.searchbox{position:relative;margin-bottom:12px}
.searchbox .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{margin:0;padding-left:40px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.filters button .i{width:15px;height:15px;color:var(--c,currentColor)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button.on .i{color:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px}
.pill.up{background:var(--neg-soft);color:var(--neg)}.pill.down{background:var(--accent-soft);color:var(--pos)}
.pill .i{width:12px;height:12px;stroke-width:2.2}

/* ===== Tema "business": sobrio, denso, bordes finos, azul marino corporativo ===== */
:root{
  --bg:#f3f4f6;--surface:#ffffff;--ink:#0b1220;--muted:#5b6475;--line:#e2e5ea;--soft:#f6f7f9;
  --accent:#1f3a68;--accent-ink:#ffffff;--accent-soft:#e8edf5;
  --pos:#127a55;--neg:#b8322a;--neg-soft:#fbeceb;--warn:#a15c07;--warn-soft:#fdf3e4;
  --hero:#0b1f3a;--hero-2:#0b1f3a;--hero-ink:#f4f6f9;--hero-muted:#93a3b8;
  --display:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;--shadow:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0d12;--surface:#11161e;--ink:#e6e9ee;--muted:#8b94a3;--line:#222a35;--soft:#161c25;
  --accent:#8fb0e6;--accent-ink:#0a1222;--accent-soft:#1a2638;
  --pos:#3ccf95;--neg:#f2766b;--neg-soft:#3a1714;--warn:#f0b04a;--warn-soft:#3a2a0c;
  --hero:#121a27;--hero-2:#121a27;--hero-ink:#eef1f5;--hero-muted:#8d9bb0}}
:root[data-theme="dark"]{
  --bg:#0a0d12;--surface:#11161e;--ink:#e6e9ee;--muted:#8b94a3;--line:#222a35;--soft:#161c25;
  --accent:#8fb0e6;--accent-ink:#0a1222;--accent-soft:#1a2638;
  --pos:#3ccf95;--neg:#f2766b;--neg-soft:#3a1714;--warn:#f0b04a;--warn-soft:#3a2a0c;
  --hero:#121a27;--hero-2:#121a27;--hero-ink:#eef1f5;--hero-muted:#8d9bb0}
html,body{font-size:14.5px;letter-spacing:-.003em}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card{border-radius:var(--r);padding:16px 16px;box-shadow:none}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.big{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:-.02em}
.amt,.flow .v,.trio .v,.stat .v,.day .num{font-family:var(--mono);font-weight:500;letter-spacing:-.01em}
.amt{font-size:14px}
.amt small{font-size:1em;font-weight:inherit;opacity:.55}.big small{font-size:.62em;opacity:.6;font-weight:500}
/* cabecera */
header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.monthnav{border-radius:8px;box-shadow:none;padding:2px}
.monthnav button{border-radius:6px;width:30px;height:30px}
.monthnav span{font-size:13px;min-width:120px}
/* resumen */
.hero{border-radius:var(--r);background:var(--hero);padding:18px 18px 16px}
.hero::after{display:none}
.hero .link{color:#b9cdf0}
.flows{gap:0;border-top:1px solid rgba(255,255,255,.1);margin-top:16px;padding-top:12px;grid-template-columns:1fr 1fr}
.flow{background:none;border-radius:0;padding:0 12px 0 0}
.flow+.flow{border-left:1px solid rgba(255,255,255,.1);padding-left:14px}
.flow .dot{width:26px;height:26px;border-radius:6px}
.hbar{height:4px;border-radius:2px}.hbar>div{border-radius:2px;background:#9fb9e3}
.bar,.mini{border-radius:2px}.bar>div,.mini>div{border-radius:2px}
/* listas */
.ico{width:34px;height:34px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.item,.cat,.menu-item,.tip{grid-template-columns:34px 1fr auto}
.tip{grid-template-columns:34px 1fr}
.item{padding:10px 0}
.item .t{font-weight:500;font-size:14px}
.day{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:18px 2px 6px}
.tag{border-radius:4px;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.menu-item .ico,.tip .ico{--c:var(--accent)!important}
/* controles */
.seg{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:18px;justify-content:flex-start}
.seg button{flex:none;border-radius:0;padding:8px 0 10px;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{background:none;box-shadow:none;color:var(--ink);border-bottom-color:var(--accent)}
.sheet .seg,#authForm .seg{justify-content:stretch}.sheet .seg button,#authForm .seg button{flex:1}
.btn{border-radius:8px;padding:11px 14px;font-weight:600;font-size:14px}
.btn.sm{border-radius:6px;padding:7px 10px;font-size:12.5px}
.field{font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.input{border-radius:8px;text-transform:none;letter-spacing:0;padding:10px 12px}
.chip{border-radius:8px}
.filters button{border-radius:6px}
.pick button{border-radius:6px}
.trio>div{border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.pill{border-radius:4px}
.empty .ico{border-radius:10px}
.fab{border-radius:8px;height:46px;padding:0 16px 0 12px;font-size:14px;box-shadow:0 6px 18px rgba(11,31,58,.28)}
.sheet{border-radius:14px 14px 0 0}
.toast{border-radius:8px}
.banner{border-radius:8px}
.hint{border-radius:8px}
nav.tabbar button .i{width:21px;height:21px}
/* acceso */
.brand .mark{border-radius:12px;background:var(--hero);box-shadow:none;color:#b9cdf0}
.brand h1{font-size:22px}
/* escritorio: menú lateral */
@media (min-width:960px){
  body{padding:28px 32px 48px 252px}
  .wrap{max-width:820px}
  nav.tabbar{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:24px 12px;background:var(--surface)}
  nav.tabbar::before{content:"Mis gastos";display:block;font-weight:700;font-size:15px;padding:0 12px 20px;color:var(--ink)}
  nav.tabbar div{flex-direction:column;gap:2px}
  nav.tabbar button{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:14px;font-weight:500;border-radius:8px;justify-content:flex-start;color:var(--muted)}
  nav.tabbar button.on{background:var(--accent-soft);color:var(--accent)}
  .fab{right:40px;bottom:32px}
  .stats{grid-template-columns:repeat(4,1fr)}
}
[hidden]{display:none!important}
.tip{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tip:last-child{border-bottom:0}
.wl-item{position:relative;border-bottom:1px solid var(--line);padding:6px 0}
.wl-item:last-child{border-bottom:0}
.wl-del{position:absolute;right:0;top:8px;z-index:2;border:0;background:var(--soft);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.wl-del .i{width:15px;height:15px}
nav.tabbar button{font-size:10.5px}
#auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:24px 4px 40px}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px;text-align:center}
.brand .mark{width:68px;height:68px;border-radius:20px;background:linear-gradient(155deg,var(--hero),var(--hero-2));display:grid;place-items:center;color:#7fe0c4;box-shadow:0 10px 30px rgba(15,27,45,.25)}
.brand .mark .i{width:34px;height:34px}
.brand h1{font-size:26px}
.brand p{margin:0;color:var(--muted);font-size:14px;max-width:300px}
#authForm h2{font-family:var(--display);font-size:20px;margin:0 0 6px}
#splash{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div id="splash">Cargando…</div>
<section id="auth" hidden>
  <div class="brand"><div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M19.5 7.5V6a1.5 1.5 0 0 0-1.5-1.5H5.5a2 2 0 0 0 0 4h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5.5a2 2 0 0 1-2-2v-11"/><circle cx="16.5" cy="14" r="1"/></svg></div>
    <h1>Mis gastos</h1><p>Tus gastos, ingresos, presupuesto y metas de ahorro, en un solo sitio. Tus datos son solo tuyos.</p></div>
  <form class="card" id="authForm" novalidate></form>
</section>
<div id="app" hidden>
<div class="wrap">
  <header>
    <h1 id="title">Resumen</h1>
    <div class="monthnav" id="monthnav">
      <button id="prev" aria-label="Mes anterior"><svg class="i" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button>
      <span id="month"></span>
      <button id="next" aria-label="Mes siguiente"><svg class="i" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg></button>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <main id="view"></main>
  <section id="invWidgets" hidden></section>
</div>

<button class="fab" id="add" aria-label="Añadir movimiento"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir</button>

<nav class="tabbar"><div>
  <button data-v="inicio" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Resumen</button>
  <button data-v="analisis"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Análisis</button>
  <button data-v="buscar"><svg class="i" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>Movimientos</button>
  <button data-v="inversion"><svg class="i" viewBox="0 0 24 24"><path d="M3 17.5 9 11.5l4 4 8-8"/><path d="M15 7.5h6v6"/></svg>Inversión</button>
  <button data-v="mas"><svg class="i" viewBox="0 0 24 24"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg>Ajustes</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toastHost"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
